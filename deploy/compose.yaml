#
# Local stack for the Native SSO work: Postgres, the mock identity system, eSignet built from this
# repository, and the oidc-ui login pages. Start it with deploy/stack.sh (it creates the
# passwords file and passes it as --env-file); do not run `docker compose up` on this file by hand.
#
# Ports on the host (all in the PS03 range 38000-38999):
#   38455 Postgres, 38082 mock identity system, 38088 eSignet, 38300 oidc-ui.
#   Published on 127.0.0.1 only, so other machines on the same network cannot reach the stack (the
#   mock identity system accepts the test OTP). The emulator and a USB phone use `adb reverse`.
# Runtime store: in memory by default (one eSignet replica). PS03_RUNTIME_STORE=redis makes deploy/stack.sh
# start the profile "redis" and point eSignet's runtime store (sessions, codes, PAR requests, consent
# tickets, DPoP jti cache) at it, as several replicas would need.
# Issuer: http://localhost:38088. Containers on the network reach eSignet as esignet:8080.
#
# Upstream files reused unchanged: ../esignet/docker-compose/init.sql (databases, schemas, seed
# user) and ../esignet/docker-compose/nginx.conf (oidc-ui proxy to esignet:8080).
name: ps03-native-sso

services:
  database:
    image: postgres:bookworm
    ports:
      - "127.0.0.1:38455:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PS03_DB_PASSWORD:?run deploy/stack.sh, it creates the passwords file}
    volumes:
      - ../esignet/docker-compose/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Over TCP: the image's first-start server that runs init.sql listens only on the Unix socket and then
      # restarts, so a socket check could report healthy before eSignet can connect (seen on 2026-10-14).
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-identity-system:
    image: mosipid/mock-identity-system:0.14.0
    user: root
    ports:
      - "127.0.0.1:38082:8082"
    environment:
      container_user: mosip
      active_profile_env: default,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${PS03_DB_PASSWORD:?}
      MOSIP_ESIGNET_HOST: localhost:38088
    depends_on:
      database:
        condition: service_healthy

  esignet:
    image: ps03-native-sso/esignet:local
    build:
      context: ..
      dockerfile: deploy/esignet.Dockerfile
    ports:
      - "127.0.0.1:38088:8080"
    environment:
      PORT: "8080"
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: mosip_esignet
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${PS03_DB_PASSWORD:?}
      KEYMANAGER_KEYSTORE_TYPE: PKCS12
      KEYMANAGER_DB_SCHEMA: esignet
      # Created on first start inside the keystore volume; removed with `down -v`.
      KEYMANAGER_PKCS12_FILE_PATH: /home/mosip/keystore/keystore.pfx
      KEYMANAGER_PKCS12_PASSWORD: ${PS03_KEYSTORE_PASSWORD:?}
      KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE: "true"
      MOSIP_ESIGNET_CACHE_TYPE: ${PS03_RUNTIME_STORE:-inmemory}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${PS03_REDIS_PASSWORD:-}
      # The issuer and the base of every DPoP htu. The emulator reaches the same URL through
      # `adb reverse`, so it must stay localhost:38088 (not 10.0.2.2).
      MOSIP_ESIGNET_HOST: http://localhost:38088
      MOSIP_ESIGNET_OIDC_UI_SCHEME: http
      MOSIP_ESIGNET_OIDC_UI_HOSTNAME: localhost
      MOSIP_ESIGNET_OIDC_UI_PORT: "38300"
      MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER: hcaptcha
      # hCaptcha's public test site key (always passes); no validator URL is set, so the server
      # skips the captcha check but still requires a non-empty captcha_token.
      MOSIP_ESIGNET_CAPTCHA_SITE_KEY: 10000000-ffff-ffff-ffff-000000000001
      MOSIP_ESIGNET_AUTHN_PROVIDER: mock
      MOSIP_ESIGNET_MOCK_DOMAIN_URL: http://mock-identity-system:8082
      # OpenID Connect Native SSO (the image's data/deployment.yaml sets the same; stated here so the stack
      # does not depend on that default): device_sso and the token-exchange grant are allowed there, and
      # the token exchange accepts only a device secret as actor_token. Discovery then shows
      # native_sso_supported: true. Each Native SSO client registers the token-exchange grant itself.
      MOSIP_ESIGNET_NATIVE_SSO_ENABLED: "true"
      MOSIP_ESIGNET_NATIVE_SSO_EXCHANGE_ONLY: "true"
      MOSIP_ESIGNET_NATIVE_SSO_SCOPE_EXCEEDED_ERROR: interaction_required
      # Consent-only re-consent: extra scopes that need no new user data are approved on
      # /oauth2/native-sso/consent without a new login.
      MOSIP_ESIGNET_NATIVE_SSO_CONSENT_ONLY_RECONSENT: "true"
      # Shortened only by e2e/run.sh phase 2 (deploy/stack.sh restart), which waits a device secret out.
      MOSIP_ESIGNET_NATIVE_SSO_DEVICE_SECRET_VALIDITY_SECONDS: ${PS03_DEVICE_SECRET_VALIDITY_SECONDS:-28800}
    volumes:
      - keystore:/home/mosip/keystore
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 40
    depends_on:
      database:
        condition: service_healthy
      mock-identity-system:
        condition: service_started
      redis:
        condition: service_healthy
        required: false

  # Shared runtime store, profile "redis" only. No persistence and no host port: a restart empties it,
  # as a restart empties the in-memory store.
  redis:
    image: redis:7.4.2-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${PS03_REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${PS03_REDIS_PASSWORD:-}

  esignet-ui:
    image: mosipid/oidc-ui:2.0.0
    user: root
    ports:
      - "127.0.0.1:38300:3000"
    environment:
      container_user: mosip
      DEFAULT_LANG: en
    volumes:
      - ../esignet/docker-compose/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - esignet

volumes:
  keystore:
