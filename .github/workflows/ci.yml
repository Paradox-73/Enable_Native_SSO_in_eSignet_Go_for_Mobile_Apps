#
# Checks for every push and pull request. Each job calls the same scripts as a local run
# (CONTRIBUTING.md), so a red job can be reproduced on a laptop with the command it shows.
# Go always runs in the golang:1.26-bookworm container started by scripts/go.sh; the runner only
# needs Docker. Emulator tests (android/scripts) stay local.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PS03_RUN_DIR: ${{ github.workspace }}/run

jobs:
  repo-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # repo-lint reads every commit message and the import commits
      - run: bash scripts/repo-lint.sh

  go-lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [thunder/backend, esignet/esignet-service]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # findings are limited to lines changed since the import commit
      - run: bash scripts/go-lint.sh ${{ matrix.module }} -- --timeout=30m
        env:
          PS03_GO_LINT_MEMORY: 6g
      - name: lint the e2e module
        if: matrix.module == 'esignet/esignet-service'
        run: bash scripts/go-lint.sh e2e -- --build-tags e2e

  go-unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: thunder/backend
            packages: ./internal/oauth/... ./pkg/...
          - module: esignet/esignet-service
            packages: ./...
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # --changed-cover measures lines changed since the import commit
      - run: bash scripts/go-test.sh ${{ matrix.module }} ${{ matrix.packages }} --changed-cover
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: go-unit-${{ strategy.job-index }}
          path: run/test-results/
          if-no-files-found: ignore

  android-unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      # The same JVM tests as a local run (docs/test-report.md), then both debug APKs and Android lint.
      - run: >-
          ./gradlew --no-daemon :oidc-client:test :secure-store:testDebugUnitTest
          :superapp:testDebugUnitTest :childapp:testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-reports
          path: android/**/build/reports/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-24.04
    needs: [go-unit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # Builds the eSignet image, starts the stack, runs both phases of the live suite, and always
      # removes the stack and its volumes.
      - run: bash scripts/with-stack.sh bash e2e/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-evidence
          path: |
            run/evidence/
            run/logs/
          if-no-files-found: ignore
