# SPDX-License-Identifier: MIT
# Lint settings for the helper tools: eSignet's own set (esignet-service/.golangci.yml), plus
# errcheck exclusions for writes to stdout/stderr and closing files opened read-only, where a
# failure has no useful handling.
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close

formatters:
  enable:
    - gofmt
    - goimports
