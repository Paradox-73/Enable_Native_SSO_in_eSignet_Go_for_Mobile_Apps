openapi: 3.0.3

info:
  title: OAuth2 / OIDC API
  description: OAuth 2.0 and OpenID Connect protocol endpoints. Covers authorization, token issuance, token introspection, pushed authorization requests, dynamic client registration, JWKS, and the OIDC UserInfo endpoint.
  version: "1.0"
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: "localhost"
      port:
        default: "8090"

tags:
  - name: Authorization
    description: OAuth 2.0 authorization endpoint and flow-engine callback.
  - name: Token
    description: OAuth 2.0 token endpoint for issuing access tokens, refresh tokens, and ID tokens.
  - name: Introspection
    description: Token introspection per RFC 7662.
  - name: Revocation
    description: Token revocation per RFC 7009.
  - name: PAR
    description: Pushed Authorization Requests per RFC 9126.
  - name: JWKS
    description: JSON Web Key Set endpoint for token verification.
  - name: UserInfo
    description: OIDC UserInfo endpoint for retrieving claims about the authenticated user.
  - name: DCR
    description: Dynamic Client Registration per RFC 7591.
  - name: Backchannel Authentication
    description: OpenID Connect Client-Initiated Backchannel Authentication (CIBA) endpoint.

security: []

paths:
  /oauth2/authorize:
    get:
      summary: Authorization endpoint
      description: |
        Initiates an OAuth 2.0 / OIDC authorization flow. On success, redirects the user-agent
        to the login page. On error, redirects to the client's registered redirect_uri or the
        server error page. When `request_uri` is provided (PAR), the stored parameters are used
        instead of the inline query parameters.
      tags:
        - Authorization
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
          description: Must be `code` for the authorization code flow.
        - name: response_mode
          in: query
          required: false
          schema:
            type: string
            enum: [query]
          description: >-
            OAuth 2.0 response mode. When omitted, query mode is used by default.
            Only query mode is supported. Requests with unsupported values such as
            fragment or form_post are rejected with invalid_request.
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: The client identifier.
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
          description: The URI to redirect to after authorization.
        - name: scope
          in: query
          required: false
          schema:
            type: string
          description: Space-separated list of requested scopes.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque value to maintain state between the request and callback.
        - name: nonce
          in: query
          required: false
          schema:
            type: string
          description: String value used to associate a client session with an ID token.
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
          description: PKCE code challenge (RFC 7636).
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256, plain]
          description: PKCE code challenge method.
        - name: request_uri
          in: query
          required: false
          schema:
            type: string
          description: Reference URI to a pushed authorization request (RFC 9126).
        - name: resource
          in: query
          required: false
          schema:
            type: string
          description: >-
            Resource indicator per RFC 8707 (absolute URI, no fragment). Only one value is
            supported; requests with multiple resource values are rejected with invalid_target.
            When omitted from a permission-bearing request, the configured
            defaultResourceServer is used. OIDC-only and scopeless requests use the
            client_id audience.
        - name: acr_values
          in: query
          required: false
          schema:
            type: string
          description: Requested Authentication Context Class Reference values.
        - name: claims
          in: query
          required: false
          schema:
            type: string
          description: JSON-encoded claims request (OIDC Core §5.5).
        - name: prompt
          in: query
          required: false
          schema:
            type: string
          description: >
            Space-separated list of prompts (OIDC Core §3.1.2.1). Supported values:
            `login` forces re-authentication; `consent` forces re-consent for all required
            attributes regardless of existing consent records.
      responses:
        "302":
          description: Redirect to the login page or the client redirect_uri on error.
          headers:
            Location:
              schema:
                type: string
        "400":
          description: Bad Request — malformed or duplicate query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/auth/callback:
    post:
      summary: Authorization callback
      description: |
        Internal endpoint invoked by the Gate after a flow terminates. It submits the flow's signed
        assertion JWT, which this endpoint validates before acting on it. A completed flow yields an
        authentication assertion and an authorization code is issued (or, for CIBA, the request is
        marked authenticated). A terminally failed flow yields an error assertion instead and the
        failure is propagated to the waiting request (authorization code: an error redirect; CIBA: the
        request is denied or marked failed). The two are distinguished by the assertion's own claims,
        so callers submit both in the same field.
      tags:
        - Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCallbackRequest'
            example:
              authId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              assertion: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Authorization code issued. The redirect_uri includes the code and state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'
              example:
                redirect_uri: "https://client.example.com/callback?code=SplxlOBeZQQYbYS6WxSbIA&state=xyz&iss=https%3A%2F%2Fserver.example.com"
        "400":
          description: Bad Request, missing authId or assertion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/token:
    post:
      summary: Token endpoint
      description: |
        Issues access tokens, refresh tokens, and ID tokens. Supports the following grant types:
        `authorization_code`, `client_credentials`, `refresh_token`, `password`,
        `urn:ietf:params:oauth:grant-type:token-exchange` (RFC 8693), and
        `urn:ietf:params:oauth:grant-type:jwt-bearer` (draft-ietf-oauth-identity-assertion-authz-grant).
        Requires client authentication via HTTP Basic auth or `client_id`/`client_secret` form parameters.

        Token exchange additionally supports requesting an Identity Assertion Authorization Grant
        (ID-JAG) by setting `requested_token_type` to
        `urn:ietf:params:oauth:token-type:id-jag`, with `subject_token_type` set to
        `urn:ietf:params:oauth:token-type:id_token` and a single required `audience` value matching
        one of the client's configured `allowedAudiences`. The `resource` parameter is optional and,
        when present, is embedded in the issued ID-JAG for the resource authorization server to
        process. Requires the client to be confidential and to have ID-JAG issuance enabled
        (`token.idJag.enabled`) on its application configuration. The response has
        `issued_token_type=urn:ietf:params:oauth:token-type:id-jag` and `token_type=N_A`, since the
        issued value is a JWT authorization grant rather than an access token.

        The `urn:ietf:params:oauth:grant-type:jwt-bearer` grant presents an ID-JAG assertion (obtained
        from a trusted external IdP) via the required `assertion` parameter, and exchanges it for a
        ThunderID access token. Optional `scope` and `resource` parameters further narrow the granted
        scopes and audience; `resource` must be a subset of the assertion's own `resource` claim when
        the assertion carries one. No refresh token is issued for this grant.

        OpenID Connect Native SSO for Mobile Apps 1.0: when the server has a device secret provider,
        a token exchange with `actor_token_type=urn:openid:params:token-type:device-secret` lets an
        app of the same vendor obtain its own tokens from the login of the first app. The request
        carries the first app's `id_token` as `subject_token` (`subject_token_type`
        `urn:ietf:params:oauth:token-type:id_token`), its `device_secret` as `actor_token`, exactly one
        `audience` equal to the issuer, and a DPoP proof signed with the key the device secret is bound
        to. The `id_token` may be expired; its `ds_hash` and `sid` must match the device secret. Both
        clients must belong to the same organization unit and allow the `device_sso` scope. The
        optional `scope` must include `openid`, must not include `device_sso`, and must be within the
        scope granted to the first app; without it, that granted scope (minus `device_sso`) is used.
        The response has a DPoP-bound access token (`token_type=DPoP`,
        `issued_token_type=urn:ietf:params:oauth:token-type:access_token`) and an `id_token` for the
        requesting app with the same `sub` and `sid`. A scope wider than the granted one answers
        `interaction_required` (or `invalid_scope` when `oauth.native_sso.scope_exceeded_error` is
        `invalid_scope`), naming the missing scope values; the app then runs its own authorization
        request so the user can consent. With `oauth.native_sso.consent_only_reconsent` on, when every
        missing value is allowed for the requesting app and releases no user claim beyond those the
        login already released (for example a permission scope), the answer also carries
        `consent_uri` and `consent_expires_in`: a one-time page where the user approves the extra
        scopes without logging in again (`/oauth2/native-sso/consent`). After the user allowed them,
        the same exchange succeeds for that login session; every binding check still applies. The
        OpenID Provider metadata then carries
        `native_sso_supported: true` and lists `device_sso` in `scopes_supported`.
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        "200":
          description: Token issued successfully.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
            Pragma:
              schema:
                type: string
              description: Always `no-cache`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                token_type: "Bearer"
                expires_in: 3600
                refresh_token: "8xLOxBtZp8"
                scope: "openid profile email"
                id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: >-
            Bad Request — invalid grant, missing parameters, or unsupported grant type. A Native SSO
            token exchange also answers `invalid_target` (audience is not the issuer),
            `unauthorized_client` (client without `device_sso`), `invalid_scope` and
            `interaction_required` (scope wider than the first app's grant), the last one with
            `consent_uri` when the user can approve the scope without a new login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              examples:
                invalidGrant:
                  value:
                    error: "invalid_grant"
                    error_description: "The provided authorization grant is invalid"
                consentOnly:
                  value:
                    error: "interaction_required"
                    error_description: "The requested scope exceeds the scope granted to the first app and can be approved at consent_uri without a new login; user consent is needed for: health_card_share"
                    consent_uri: "https://esignet.example.com/oauth2/native-sso/consent?ticket=4n3h0yW2qGvJ8lq9oP0bq1yQx7m0f6Zc1tVdQe8uFh0"
                    consent_expires_in: 300
        "401":
          description: Unauthorized — client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/bc-authorize:
    post:
      summary: Backchannel authentication endpoint
      description: |
        Initiates an OpenID Connect Client-Initiated Backchannel Authentication (CIBA) request in
        poll mode. The client identifies the user with exactly one of `login_hint` or `id_token_hint`
        (`login_hint_token` is defined by the specification but not supported and is rejected with
        `invalid_request`), and the server begins an out-of-band authentication ceremony. The returned
        `auth_req_id` is polled at the token endpoint using the `urn:openid:params:grant-type:ciba`
        grant. Requires client authentication.

        RFC 8707 resource indicators bind the request to a single resource server before user
        authorization. A valid `resource` binds the request to that resource server; when omitted from
        a permission-bearing request the configured `defaultResourceServer` is used, and a
        permission-bearing request with no resource and no default is rejected with `invalid_target`.
        OIDC-only requests without a resource remain valid and keep the `client_id` audience. Multiple
        `resource` values, including duplicates, are rejected with `invalid_target`. The resulting
        access token has the bound resource server identifier as its sole `aud`, and its permissions
        are limited to those defined by that resource server. A `resource` optionally supplied when
        polling the token endpoint must exactly match the bound resource server.
      tags:
        - Backchannel Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BackchannelAuthRequest'
      responses:
        "200":
          description: Backchannel authentication request accepted.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
            Pragma:
              schema:
                type: string
              description: Always `no-cache`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackchannelAuthResponse'
              example:
                auth_req_id: "1c266114-a1be-4252-8ad1-04986c5b9ac1"
                expires_in: 120
                interval: 5
        "400":
          description: >-
            Bad Request — invalid_request, invalid_scope, invalid_target, unknown_user_id,
            invalid_binding_message, or unauthorized_client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: "invalid_target"
                error_description: "The resource parameter does not match any registered resource server"
        "401":
          description: Unauthorized — client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/par:
    post:
      summary: Pushed Authorization Request endpoint
      description: |
        Accepts authorization request parameters and stores them server-side, returning a
        `request_uri` that can be passed to the authorization endpoint. Implements RFC 9126.
        Requires client authentication.
      tags:
        - PAR
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PARRequest'
      responses:
        "201":
          description: Authorization request accepted and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PARResponse'
              example:
                request_uri: "urn:ietf:params:oauth:request_uri:bwc4JDEclOl15qiPviJQ2w"
                expires_in: 60
        "400":
          description: Bad Request — invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "401":
          description: Unauthorized — client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/introspect:
    post:
      summary: Token introspection endpoint
      description: |
        Returns metadata about a token. If the token is invalid, expired, or revoked, the
        response will contain `"active": false` with no other fields. Implements RFC 7662.
        Requires client authentication.
      tags:
        - Introspection
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
            example:
              token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Introspection result (active or inactive token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectResponse'
              examples:
                active:
                  summary: Active token
                  value:
                    active: true
                    scope: "openid profile"
                    client_id: "my-client"
                    username: "alice"
                    token_type: "Bearer"
                    exp: 1735689600
                    iat: 1735686000
                    sub: "user-123"
                    iss: "https://server.example.com"
                inactive:
                  summary: Inactive or expired token
                  value:
                    active: false
        "400":
          description: Bad Request — token parameter is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "401":
          description: Unauthorized — client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/revoke:
    post:
      summary: Token revocation endpoint
      description: |
        Revokes a previously issued access or refresh token. On success the server responds with
        HTTP 200 and an empty body. A token that cannot be validated — bad signature, malformed, or
        unknown — is treated as a successful no-op per RFC 7009. Expired tokens with a valid
        signature remain revocable. Requires client authentication; a client may only revoke tokens
        issued to it. Implements RFC 7009.

        **Native SSO**: the endpoint also revokes an OpenID Connect Native SSO device secret
        (`token_type_hint=device_secret`, or no hint and a compact JWE). Revoking it ends its login
        session in the Device Secret Provider, so every later token exchange with it is refused
        with `invalid_grant`, and access tokens earlier exchanges issued for that session (they
        carry its `sid`) fail validation at userinfo and introspection. Only the client the device
        secret was issued to may revoke it. When the
        engine has a Device Secret Provider the endpoint exists even with token revocation turned
        off; other tokens then get `unsupported_token_type`.
      tags:
        - Revocation
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
            example:
              token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Token revoked, or a no-op success for a token that cannot be validated. Empty body.
        "400":
          description: >-
            Bad Request — the token parameter is missing (`invalid_request`), or the token was
            issued to a different client (`invalid_grant`), or token revocation is off and the token
            is not a device secret (`unsupported_token_type`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "401":
          description: Unauthorized — client authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "500":
          description: >-
            Internal server error — the revocation could not be recorded, for example when the
            runtime persistent database or the device secret session store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/native-sso/consent:
    get:
      summary: Native SSO consent page (consent-only re-consent)
      operationId: getNativeSSOConsentPage
      description: |
        The page named by `consent_uri` in the `interaction_required` answer of an OpenID Connect
        Native SSO token exchange. It shows the requesting app, the app the user signed in to, and the
        extra scopes, with "Allow" and "Not now". No login: the ticket was issued only after the
        exchange passed every binding check (device secret, `id_token`, `ds_hash`, `sid`, same vendor,
        DPoP key of the device secret). Showing the page does not use the ticket up. Registered only
        when the engine has a Device Secret Provider and `oauth.native_sso.consent_only_reconsent` is
        on. Answers carry `Cache-Control: no-store`, `X-Frame-Options: DENY`,
        `Referrer-Policy: same-origin` and a Content-Security-Policy without scripts.
      tags:
        - Token
      parameters:
        - name: ticket
          in: query
          required: true
          description: The one-time ticket from `consent_uri` (256 random bits, base64url).
          schema:
            type: string
      responses:
        "200":
          description: The consent page.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: The ticket is unknown, malformed, expired or already answered.
          content:
            text/html:
              schema:
                type: string
        "500":
          description: The ticket store could not be read.
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Native SSO consent decision
      operationId: postNativeSSOConsentDecision
      description: |
        The form of the consent page. Uses the ticket up first, so it can be answered once. `allow`
        records the approval for this app and this login session until the device secret expires;
        `deny` records nothing. Both write an audit line (`native_sso_consent_granted` or
        `native_sso_consent_denied`, with the client ids, the scopes and a hash of the session, no
        user data) and redirect to the app's registered redirect URI with
        `native_sso_consent=granted` or `native_sso_consent=denied`. The redirect carries no
        authority: the app repeats the token exchange, which checks the approval. A form from another
        origin (`Origin`, `Sec-Fetch-Site`) is refused.
      tags:
        - Token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - ticket
                - decision
              properties:
                ticket:
                  type: string
                decision:
                  type: string
                  enum: [allow, deny]
      responses:
        "303":
          description: Back to the app's single registered redirect URI with `native_sso_consent`.
          headers:
            Location:
              schema:
                type: string
              example: "org.badmosip.nativesso.childapp://oauth/callback?native_sso_consent=granted"
        "200":
          description: Done; the app has more than one redirect URI, so the page asks the user to go back to it.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown, expired or already answered ticket, an unknown decision, or a body over 4 KiB.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: The form was posted from another origin.
          content:
            text/html:
              schema:
                type: string
        "500":
          description: The approval could not be stored.
          content:
            text/html:
              schema:
                type: string

  /oauth2/jwks:
    get:
      summary: JSON Web Key Set
      description: Returns the server's public keys in JWKS format for verifying signed tokens.
      tags:
        - JWKS
      responses:
        "200":
          description: JWKS retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'
              example:
                keys:
                  - kty: "RSA"
                    use: "sig"
                    alg: "RS256"
                    kid: "key-1"
                    n: "0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM78LhWx..."
                    e: "AQAB"
        "500":
          description: Internal server error — JWKS could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oauth2/userinfo:
    get:
      summary: UserInfo endpoint (GET)
      description: |
        Returns claims about the authenticated end-user. The access token must be sent in the
        `Authorization: Bearer <token>` header. The response is a JSON object or a signed/encrypted
        JWT depending on the client's registration settings. Implements OIDC Core §5.3.
      tags:
        - UserInfo
      responses:
        "200":
          description: UserInfo claims returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                sub: "user-123"
                name: "Alice Smith"
                email: "alice@example.com"
                email_verified: true
            application/jwt:
              schema:
                type: string
                description: Signed (JWS) or encrypted (JWE) UserInfo response.
        "401":
          description: Unauthorized — missing or invalid Bearer token.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: 'Bearer'
        "403":
          description: Forbidden — token scope is insufficient.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: 'Bearer error="insufficient_scope", error_description="Required scope is missing"'
    post:
      summary: UserInfo endpoint (POST)
      description: |
        Identical to the GET variant but accepts the access token via HTTP POST body or
        `Authorization` header per OIDC Core §5.3.2.
      tags:
        - UserInfo
      responses:
        "200":
          description: UserInfo claims returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
            application/jwt:
              schema:
                type: string
        "401":
          description: Unauthorized — missing or invalid Bearer token.
        "403":
          description: Forbidden — token scope is insufficient.

  /oauth2/dcr/register:
    post:
      summary: Dynamic Client Registration
      description: |
        Registers a new OAuth 2.0 / OIDC client. When DCR is not configured as insecure, a
        valid access token with system-level permissions is required. Implements RFC 7591.
      tags:
        - DCR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DCRRegistrationRequest'
            example:
              client_name: "My App"
              redirect_uris:
                - "https://myapp.example.com/callback"
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              token_endpoint_auth_method: client_secret_basic
              scope: "openid profile email"
      responses:
        "201":
          description: Client registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DCRRegistrationResponse'
              example:
                client_id: "s6BhdRkqt3"
                client_secret: "ZJYCqe3GGRvdrudKyZS0XhGv_Z45DuKhCUk0gBR1vZk"
                client_secret_expires_at: 0
                client_name: "My App"
                redirect_uris:
                  - "https://myapp.example.com/callback"
                grant_types:
                  - authorization_code
                  - refresh_token
                response_types:
                  - code
                token_endpoint_auth_method: client_secret_basic
        "400":
          description: Bad Request — invalid registration parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "401":
          description: Unauthorized — missing or insufficient access token (when DCR is not insecure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

components:
  schemas:
    AuthCallbackRequest:
      type: object
      required:
        - authId
        - assertion
      properties:
        authId:
          type: string
          description: The authorization session identifier returned by the flow engine.
        assertion:
          type: string
          description: Signed JWT assertion from the flow engine carrying the terminal flow outcome. A completed flow returns an authentication assertion (relay the flow response's assertion field); a terminally failed flow returns an error assertion carrying the flow error type and description (relay the flow response's errorAssertion field). The server validates the signature and the binding to this authorization request before acting, and tells the two apart by the assertion's own claims.
        type:
          type: string
          description: OAuth grant type of the request. Defaults to the authorization code flow when absent.

    AuthCallbackResponse:
      type: object
      required:
        - redirect_uri
      properties:
        redirect_uri:
          type: string
          description: The full redirect URI for the client, including the authorization code and state.

    TokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - client_credentials
            - refresh_token
            - password
            - urn:ietf:params:oauth:grant-type:token-exchange
            - urn:ietf:params:oauth:grant-type:jwt-bearer
            - urn:openid:params:grant-type:ciba
          description: The OAuth 2.0 grant type.
        client_id:
          type: string
          description: The client identifier (required when not using HTTP Basic auth).
        client_secret:
          type: string
          description: The client secret (required for confidential clients not using HTTP Basic auth).
        code:
          type: string
          description: The authorization code (required for authorization_code grant).
        redirect_uri:
          type: string
          description: Must match the redirect_uri used in the authorization request.
        code_verifier:
          type: string
          description: PKCE code verifier (RFC 7636).
        scope:
          type: string
          description: Space-separated list of requested scopes.
        refresh_token:
          type: string
          description: The refresh token (required for refresh_token grant).
        username:
          type: string
          description: The resource owner username (required for password grant).
        password:
          type: string
          description: The resource owner password (required for password grant).
        subject_token:
          type: string
          description: The subject token for token exchange (RFC 8693).
        subject_token_type:
          type: string
          description: The type URI of the subject token.
        actor_token:
          type: string
          description: The actor token for token exchange (RFC 8693).
        actor_token_type:
          type: string
          description: >-
            The type URI of the actor token. `urn:openid:params:token-type:device-secret` selects the
            OpenID Connect Native SSO token exchange; the older
            `urn:x-oath:params:oauth:token-type:device-secret` is rejected with `invalid_request`.
        dpop_jkt:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: >-
            OpenID Connect Native SSO token exchange only, optional profile extension. RFC 9449 section 10
            defines dpop_jkt for the authorization request; at the token endpoint it is this profile's own.
            The SHA-256 JWK thumbprint of the requesting app's own DPoP key: the issued access token is
            bound to it, while the DPoP header must still prove the key the device secret is bound to. The
            named key is not proven. Without it the token is bound to the key of the DPoP header. Other
            grants ignore it.
        requested_token_type:
          type: string
          description: >-
            The desired type of the issued token (token exchange only). Set to
            `urn:ietf:params:oauth:token-type:id-jag` to request an Identity Assertion Authorization
            Grant instead of an access token; this requires `subject_token_type` to be
            `urn:ietf:params:oauth:token-type:id_token` and exactly one `audience` value.
        audience:
          type: string
          description: >-
            Accepted for RFC 8693 token-exchange compatibility; it does not determine the issued
            access token's aud claim (use resource to select the token audience). Required, and
            limited to exactly one value, when requesting an ID-JAG
            (`requested_token_type=urn:ietf:params:oauth:token-type:id-jag`); then the value must
            match one of the client's configured `allowedAudiences`.
        resource:
          type: string
          description: >-
            Resource indicator (RFC 8707). For access-token issuance, binds the issued access token
            to exactly one resource server. When omitted from a permission-bearing request, the
            configured defaultResourceServer is used, and if neither is available the request is
            rejected with invalid_target. OIDC-only and scopeless requests use the client_id audience. Optional
            for ID-JAG requests, where it is embedded in the issued ID-JAG's `resource` claim. For
            the jwt-bearer grant, when present it must be a subset of the assertion's own `resource`
            claim.
        assertion:
          type: string
          description: >-
            ID-JAG assertion JWT issued by a trusted external IdP (draft-ietf-oauth-identity-assertion-authz-grant).
            Required for the `urn:ietf:params:oauth:grant-type:jwt-bearer` grant.
        auth_req_id:
          type: string
          description: >-
            The backchannel authentication request identifier returned by /oauth2/bc-authorize.
            Required for the `urn:openid:params:grant-type:ciba` grant.

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The issued access token.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Lifetime of the access token in seconds.
        refresh_token:
          type: string
          description: The refresh token, if issued.
        scope:
          type: string
          description: The scopes granted (may differ from those requested).
        id_token:
          type: string
          description: The ID token, issued for openid scope.
        issued_token_type:
          type: string
          description: The type of the issued token (token exchange only).
        device_secret:
          type: string
          description: >-
            OpenID Connect Native SSO for Mobile Apps 1.0 device secret. Returned by the
            `authorization_code` grant when the `device_sso` scope was granted and the server has a
            device secret provider. Opaque to the client; another app of the same vendor presents it
            as the `actor_token` of a token exchange, with `actor_token_type`
            `urn:openid:params:token-type:device-secret`.

    PARRequest:
      type: object
      required:
        - response_type
        - client_id
      properties:
        response_type:
          type: string
          enum: [code]
        client_id:
          type: string
        redirect_uri:
          type: string
        scope:
          type: string
        state:
          type: string
        nonce:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [S256, plain]
        resource:
          type: string
          description: >-
            Resource indicator per RFC 8707 (absolute URI). Only one value is supported; multiple
            resource values are rejected with invalid_target.
        acr_values:
          type: string
        claims:
          type: string
        prompt:
          type: string
          description: >
            Space-separated list of prompts (OIDC Core §3.1.2.1). Supported values:
            `login` forces re-authentication; `consent` forces re-consent for all required
            attributes regardless of existing consent records.

    PARResponse:
      type: object
      required:
        - request_uri
        - expires_in
      properties:
        request_uri:
          type: string
          description: The request URI referencing the stored authorization parameters.
          example: "urn:ietf:params:oauth:request_uri:bwc4JDEclOl15qiPviJQ2w"
        expires_in:
          type: integer
          format: int64
          description: Lifetime of the request_uri in seconds.

    IntrospectRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The token to introspect.
        token_type_hint:
          type: string
          description: Hint about the type of the submitted token.

    RevokeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The access token, refresh token or Native SSO device secret to revoke.
        token_type_hint:
          type: string
          description: >-
            Hint about the type of the submitted token (`access_token` or `refresh_token`). Accepted
            per RFC 7009 §2.1 but optional; ThunderID tokens are self-describing, so the hint does not
            affect processing. Exception: `device_secret` sends the token to the Native SSO
            device secret path.

    IntrospectResponse:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
          description: Indicates whether the token is currently active.
        scope:
          type: string
        client_id:
          type: string
        username:
          type: string
        token_type:
          type: string
        exp:
          type: integer
          format: int64
        iat:
          type: integer
          format: int64
        nbf:
          type: integer
          format: int64
        sub:
          type: string
        aud:
          description: Audience — may be a string or an array of strings.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        iss:
          type: string
        jti:
          type: string

    JWKSResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'

    JWK:
      type: object
      required:
        - kty
      properties:
        kid:
          type: string
          description: Key ID.
        kty:
          type: string
          description: Key type (e.g. RSA, EC).
        use:
          type: string
          description: Intended use (sig or enc).
        alg:
          type: string
          description: Algorithm.
        n:
          type: string
          description: RSA modulus (Base64urlUInt).
        e:
          type: string
          description: RSA public exponent (Base64urlUInt).
        crv:
          type: string
          description: EC curve name.
        x:
          type: string
          description: EC x coordinate.
        y:
          type: string
          description: EC y coordinate.
        x5c:
          type: array
          items:
            type: string
          description: X.509 certificate chain.
        x5t:
          type: string
          description: X.509 certificate SHA-1 thumbprint.
        x5t#S256:
          type: string
          description: X.509 certificate SHA-256 thumbprint.

    UserInfoResponse:
      type: object
      required:
        - sub
      properties:
        sub:
          type: string
          description: Subject identifier.
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        middle_name:
          type: string
        nickname:
          type: string
        preferred_username:
          type: string
        profile:
          type: string
        picture:
          type: string
        website:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        gender:
          type: string
        birthdate:
          type: string
        zoneinfo:
          type: string
        locale:
          type: string
        phone_number:
          type: string
        phone_number_verified:
          type: boolean
        updated_at:
          type: integer
          format: int64
      additionalProperties: true

    DCRRegistrationRequest:
      type: object
      required:
        - redirect_uris
      properties:
        ou_id:
          type: string
          description: Organization Unit ID to associate the client with.
        redirect_uris:
          type: array
          items:
            type: string
          description: Registered redirect URIs.
        grant_types:
          type: array
          items:
            type: string
            enum:
              - authorization_code
              - implicit
              - client_credentials
              - refresh_token
              - urn:ietf:params:oauth:grant-type:token-exchange
        response_types:
          type: array
          items:
            type: string
            enum: [code]
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        token_endpoint_auth_method:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
            - private_key_jwt
            - none
        jwks_uri:
          type: string
        jwks:
          type: object
          additionalProperties: true
        scope:
          type: string
        contacts:
          type: array
          items:
            type: string
        tos_uri:
          type: string
        policy_uri:
          type: string
        require_pushed_authorization_requests:
          type: boolean
        userinfo_signed_response_alg:
          type: string
        userinfo_encrypted_response_alg:
          type: string
        userinfo_encrypted_response_enc:
          type: string
        id_token_encrypted_response_alg:
          type: string
        id_token_encrypted_response_enc:
          type: string
      description: Language-tagged fields (e.g. `client_name#fr`) are also accepted as top-level properties.

    DCRRegistrationResponse:
      type: object
      required:
        - client_id
        - client_secret_expires_at
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        client_secret_expires_at:
          type: integer
          format: int64
          description: Unix timestamp when the secret expires, or 0 if it never expires.
        app_id:
          type: string
          description: Internal application ID.
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        token_endpoint_auth_method:
          type: string
        jwks_uri:
          type: string
        jwks:
          type: object
          additionalProperties: true
        scope:
          type: string
        contacts:
          type: array
          items:
            type: string
        tos_uri:
          type: string
        policy_uri:
          type: string
        require_pushed_authorization_requests:
          type: boolean
        userinfo_signed_response_alg:
          type: string
        userinfo_encrypted_response_alg:
          type: string
        userinfo_encrypted_response_enc:
          type: string
        id_token_encrypted_response_alg:
          type: string
        id_token_encrypted_response_enc:
          type: string
      description: Language-tagged variants (e.g. `client_name#fr`) are included as top-level properties in the response.

    BackchannelAuthRequest:
      type: object
      required:
        - scope
      properties:
        client_id:
          type: string
          description: The client identifier (required when not using HTTP Basic auth).
        client_secret:
          type: string
          description: The client secret (required for confidential clients not using HTTP Basic auth).
        login_hint:
          type: string
          description: >-
            A hint identifying the user to authenticate. Exactly one of login_hint or id_token_hint
            must be provided.
        id_token_hint:
          type: string
          description: >-
            A previously issued ID token identifying the user. Exactly one of login_hint or
            id_token_hint must be provided.
        login_hint_token:
          type: string
          description: >-
            Defined by the CIBA specification but not supported; requests including it are rejected
            with invalid_request. Use login_hint instead.
        scope:
          type: string
          description: Space-separated scopes. Must include `openid`.
        resource:
          type: string
          description: >-
            Resource indicator per RFC 8707 (absolute URI, no fragment). Only one value is
            supported; requests with multiple resource values, including duplicates, are rejected
            with invalid_target. When omitted from a permission-bearing request, the configured
            defaultResourceServer is used; a permission-bearing request with no resource and no
            default is rejected with invalid_target. OIDC-only requests use the client_id audience.
        binding_message:
          type: string
          description: >-
            Optional human-readable message shown to the user in the authentication notification
            (CIBA Core 1.0 §7.1). Limited to 256 printable characters.
        requested_expiry:
          type: integer
          description: Requested lifetime of the auth_req_id in seconds. Clamped to the server maximum.
        acr_values:
          type: string
          description: Space-separated list of requested Authentication Context Class Reference values.
    BackchannelAuthResponse:
      type: object
      required:
        - auth_req_id
        - expires_in
        - interval
      properties:
        auth_req_id:
          type: string
          description: Unique identifier for the backchannel authentication request, polled at the token endpoint.
        expires_in:
          type: integer
          description: Lifetime of the auth_req_id in seconds.
        interval:
          type: integer
          description: Minimum number of seconds the client must wait between token endpoint polls.
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: OAuth 2.0 error code.
          example: invalid_request
        error_description:
          type: string
          description: Human-readable error description.
        consent_uri:
          type: string
          format: uri
          description: >-
            Native SSO token exchange only, with `interaction_required`: a one-time page where the user
            approves the extra scopes without a new login.
        consent_expires_in:
          type: integer
          description: Lifetime of `consent_uri` in seconds.
